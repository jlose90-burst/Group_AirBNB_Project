<html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/logo_face.svg">
    <title>Sign Up - LairBnB</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/login.css">
  </head>

  <body class="page_signup">

    <header class="page_top_header header_split">

      <div class="header_space"></div>

      <a href="/locations" class="logo">
        <img src="/static/images/logo_face.svg" alt="LairBnB Logo Face" class="site_icon">
        <img src="static/images/logo_text_2.svg" alt="LairBnB Logo" class="site_logo">
      </a>

      <div class="header_space"></div>
      
    </header>

    <main class="signup_container">
  
        <div class="signup_header">
          <h1>Sign Up</h1>
        </div>

        <form method="POST" action="/signup" class="signup_form">
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

          <div class="form_group">
            <label for="username">Username</label>
            <input type="text" name="username" placeholder="Username" required>
          </div>

          <div class="form_group">
            <label for="email">Email Address</label>
            <input type="text" name="email" placeholder="Email Address" required>
          </div>
          
          <div class="form_group">
            <label for="phone">Phone Number</label>
            <input type="text" name="phone" placeholder="Phone Number" required>
          </div>

          <div class="form_group">
            <label for="password">Password</label>
            <input type="password" name="password" placeholder="Password" required>
          </div>

          <div class="form_group">
            <label for="password_confirm">Password Confirmation</label>
            <input type="password" name="password_confirm" placeholder="Password Confirmation" required>
          </div>
          
          <button type="submit" class="btn_primary">Sign Up</button>

          <div class="link">
            <a href="/login">Already a member?</a>
          </div>

        </form>
        
    </main>

  </body>

</html>
