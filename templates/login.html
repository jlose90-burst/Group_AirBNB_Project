<html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/logo_face.svg">
    <title>Log In - LairBnB</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/login.css">
  </head>

  <body class="page_login">

    <header class="page_top_header header_split">

      <div class="header_space"></div>

      <a href="/locations" class="logo">
        <img src="/static/images/logo_face.svg" alt="LairBnB Logo Face" class="site_icon">
        <img src="static/images/logo_text_2.svg" alt="LairBnB Logo" class="site_logo">
      </a>

      <div class="header_space"></div>
      
    </header>

    <main class="login_container">
  
        <div class="login_header">
          <h1>Login</h1>
        </div>
        
        <form method="POST" action="/login" class="login_form">

          <div class="form_group">
            <label for="email">Email Address</label>
            <input type="text" name="email" placeholder="Email Address">
          </div>
          
          <div class="form_group">
            <label for="password">Password</label>
            <input type="password" name="password" placeholder="Password">
          </div>
          
          <button type="submit" class="btn_primary">Log In</button>

          <div class="link">
            <a href="/signup">Not a member?</a>
          </div>

        </form>
        
    </main>

  </body>

</html>
